                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
function prepararVentasJireh() {
  const producto = document.getElementById("saleProduct");
  const cantidad = document.getElementById("saleQty");
  const total = document.getElementById("saleTotal");
  const boton = document.getElementById("confirmSale");
  if (!producto || !cantidad || !total || !boton) return;

  function actualizarLista() {
    const anterior = producto.value;
    producto.replaceChildren();
    products.forEach(p => {
      const opcion = document.createElement("option");
      opcion.value = p.id;
      opcion.textContent = p.name + " (Disponible: " + p.stock + ")";
      producto.appendChild(opcion);
    });
    if (products.some(p => String(p.id) === anterior)) producto.value = anterior;
    actualizarTotal();
  }

  function actualizarTotal() {
    const p = products.find(x => String(x.id) === producto.value);
    const qty = Number(cantidad.value);
    if (!p) { total.textContent = "No hay productos registrados."; return; }
    if (!Number.isInteger(qty) || qty <= 0) {
      total.textContent = "Introduce una cantidad válida."; return;
    }
    const usd = Number((p.price * qty).toFixed(2));
    const bs = convertirABolivares(usd);
    total.textContent = "Total: $" + usd.toFixed(2) +
      (Number.isFinite(bs) ? " | Bs. " + bs.toLocaleString("es-VE", {minimumFractionDigits:2, maximumFractionDigits:2}) : " | Tasa BCV no disponible");
  }

  producto.addEventListener("change", actualizarTotal);
  cantidad.addEventListener("input", actualizarTotal);
  boton.addEventListener("click", () => {
    const p = products.find(x => String(x.id) === producto.value);
    const qty = Number(cantidad.value);
    if (!p || !Number.isInteger(qty) || qty <= 0 || qty > p.stock) {
      alert("Revisa la cantidad y la existencia disponible."); return;
    }
    const usd = Number((p.price * qty).toFixed(2));
    if (!confirm("¿Confirmar venta de " + qty + " " + p.name + " por $" + usd.toFixed(2) + "?")) return;
    p.stock -= qty;
    save();
    render();
    actualizarLista();
    alert("Venta confirmada. Inventario actualizado.");
  });

  const observer = new MutationObserver(() => {
    observer.disconnect();
    actualizarLista();
    observer.observe(document.getElementById("products"), {childList:true});
  });
  const contenedor = document.getElementById("products");
  if (contenedor) observer.observe(contenedor, {childList:true});
  actualizarLista();
}
prepararVentasJireh();

actualizarTasaBCV();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
