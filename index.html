
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="theme-color" content="#06482d">
        <title>JIREH — Víveres y Más</title>
          <style>
              :root { --green:#06482d; --gold:#d9ad37; --cream:#fffaf0; }
                  * { box-sizing:border-box; }
                      body { margin:0; font-family:Arial,sans-serif; background:var(--cream); color:#183c2a; }
                          header { background:var(--green); color:white; padding:22px 16px; border-bottom:5px solid var(--gold); }
                              header h1 { margin:0; font-size:28px; }
                                  header p { margin:6px 0 0; color:#f6df9c; }
                                      main { max-width:760px; margin:auto; padding:16px; }
                                          .card { background:white; padding:16px; border-radius:14px; margin-bottom:14px; box-shadow:0 2px 9px #00000012; }
                                              h2 { font-size:19px; margin:0 0 14px; }
                                                  label { display:block; font-size:13px; margin:10px 0 5px; font-weight:bold; }
                                                      input,select,button { width:100%; padding:12px; border-radius:9px; font-size:16px; }
                                                          input,select { border:1px solid #cbd7cd; background:white; }
                                                              button { border:0; background:var(--green); color:white; font-weight:bold; margin-top:12px; cursor:pointer; }
                                                                  button.gold { background:var(--gold); color:#173b28; }
                                                                      .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
                                                                          .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
                                                                              .stat { padding:13px; background:#edf5ee; border-radius:10px; }
                                                                                  .stat span { display:block; font-size:12px; }
                                                                                      .stat strong { display:block; font-size:20px; margin-top:6px; overflow-wrap:anywhere; }
                                                                                          .product { border-top:1px solid #e5eae5; padding:12px 0; }
                                                                                              .muted { color:#647469; font-size:13px; }
                                                                                                  .actions { display:flex; gap:8px; }
                                                                                                      .actions button { flex:1; font-size:13px; }
                                                                                                          #message { padding:10px; border-radius:8px; background:#edf5ee; margin-bottom:12px; display:none; }
                                                                                                              @media(max-width:380px) { .grid { grid-template-columns:1fr; } }
                                                                                                                </style>
                                                                                                                </head>
                                                                                                                <body>
                                                                                                                <header>
                                                                                                                  <h1>JIREH</h1>
                                                                                                                    <p>VÍVERES Y MÁS · Dios proveerá</p>
                                                                                                                    </header>
                                                                                                                    <main>
                                                                                                                      <div id="message" role="status"></div>
                                                                                                                        <section class="card">
                                                                                                                            <h2>📊 Resumen del inventario</h2>
                                                                                                                                <div class="stats">
                                                                                                                                      <div class="stat"><span>Productos registrados</span><strong id="count">0</strong></div>
                                                                                                                                            <div class="stat"><span>Unidades en existencia</span><strong id="units">0</strong></div>
                                                                                                                                                </div>
                                                                                                                                                    <p class="muted">Los datos se guardan en este navegador. Todavía no se sincronizan con otro dispositivo.</p>
                                                                                                                                                      </section>

                                                                                                                                                        <section class="card">
                                                                                                                                                            <h2>➕ Agregar producto</h2>
                                                                                                                                                                <form id="productForm">
                                                                                                                                                                      <label for="name">Nombre del producto</label>
                                                                                                                                                                            <input id="name" required placeholder="Ej. Harina PAN">

                                                                                                                                                                                  <div class="grid">
                                                                                                                                                                                          <div><label for="category">Categoría</label>
                                                                                                                                                                                                    <select id="category">
                                                                                                                                                                                                                <option>Harinas</option><option>Arroz y granos</option>
                                                                                                                                                                                                                            <option>Pasta</option><option>Azúcar</option>
                                                                                                                                                                                                                                        <option>Huevos y queso</option><option>Aceites</option>
                                                                                                                                                                                                                                                    <option>Limpieza</option><option>Hogar</option><option>Otros</option>
                                                                                                                                                                                                                                                              </select>
                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                              <div><label for="unit">Unidad</label>
                                                                                                                                                                                                                                                                                        <select id="unit"><option>unidad</option><option>kg</option><option>paquete</option><option>litro</option><option>docena</option></select>
                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                            <div class="grid">
                                                                                                                                                                                                                                                                                                                    <div><label for="stock">Existencia inicial</label><input id="stock" type="number" min="0" step="0.001" value="0" required></div>
                                                                                                                                                                                                                                                                                                                            <div><label for="cost">Costo última compra (USD)</label><input id="cost" type="number" min="0" step="0.0001" value="0" required></div>
                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                        <label for="price">Precio de venta (USD)</label>
                                                                                                                                                                                                                                                                                                                                              <input id="price" type="number" min="0" step="0.0001" value="0" required>
                                                                                                                                                                                                                                                                                                                                                    <button type="submit">Guardar producto</button>
                                                                                                                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                                                                                                          </section>

                                                                                                                                                                                                                                                                                                                                                            <section class="card">
                                                                                                                                                                                                                                                                                                                                                                <h2>📦 Productos</h2>
                                                                                                                                                                                                                                                                                                                                                                    <label for="search">Buscar producto</label>
                                                                                                                                                                                                                                                                                                                                                                        <input id="search" placeholder="Escribe un nombre...">
                                                                                                                                                                                                                                                                                                                                                                            <div id="products"></div>
                                                                                                                                                                                                                                                                                                                                                                              </section>
                                                                                                                                                                                                                                                                                                                                                                              <section class="card">
<h2>🛒 Nueva venta</h2>
<label for="saleProduct">Producto</label>
<select id="saleProduct"></select>
<label for="saleQty">Cantidad</label>
<input id="saleQty" type="number" min="1" step="1" value="1">
<div id="saleTotal" class="muted"></div>
<button type="button" id="confirmSale">Confirmar venta</button>
</section>
</main>

                                                                                                                                                                                                                                                                                                                                                                              <script>
                                                                                                                                                                                                                                                                                                                                                                              const KEY = "jireh_inventory_v1";
                                                                                                                                                                                                                                                                                                                                                                              let products = [];
                                                                                                                                                                                                                                                                                                                                                                              try { products = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch {}

                                                                                                                                                                                                                                                                                                                                                                              const money = n => "$" + Number(n || 0).toFixed(2);
                                                                                                                                                                                                                                                                                                                                                                              const el = id => document.getElementById(id);

                                                                                                                                                                                                                                                                                                                                                                              function notify(text) {
                                                                                                                                                                                                                                                                                                                                                                                el("message").textContent = text;
                                                                                                                                                                                                                                                                                                                                                                                  el("message").style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                    setTimeout(() => el("message").style.display = "none", 3000);
                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                    function save() {
                                                                                                                                                                                                                                                                                                                                                                                      try {
                                                                                                                                                                                                                                                                                                                                                                                          localStorage.setItem(KEY, JSON.stringify(products));
                                                                                                                                                                                                                                                                                                                                                                                              render();
                                                                                                                                                                                                                                                                                                                                                                                                } catch { notify("No se pudieron guardar los datos en este navegador."); }
                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                function convertirABolivares(precioUSD) {
  try {
    const registro = JSON.parse(localStorage.getItem("jireh_tasa_bcv") || "null");
    const tasa = Number(registro?.tasa);
    if (!Number.isFinite(tasa) || tasa <= 0) return null;
    return Number(precioUSD) * tasa;
  } catch (error) {
    return null;
  }
}

function render() {
                                                                                                                                                                                                                                                                                                                                                                                                  el("count").textContent = products.length;
                                                                                                                                                                                                                                                                                                                                                                                                    el("units").textContent = products.reduce((s,p) => s + p.stock, 0).toLocaleString("es-VE");
                                                                                                                                                                                                                                                                                                                                                                                                      const query = el("search").value.trim().toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                        const filtered = products.filter(p => p.name.toLowerCase().includes(query));
                                                                                                                                                                                                                                                                                                                                                                                                          el("products").innerHTML = "";
                                                                                                                                                                                                                                                                                                                                                                                                            if (!filtered.length) {
                                                                                                                                                                                                                                                                                                                                                                                                                el("products").textContent = "Todavía no hay productos. Agrega el primero arriba.";
                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                        filtered.forEach(p => {
                                                                                                                                                                                                                                                                                                                                                                                                                            const item = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                item.className = "product";
                                                                                                                                                                                                                                                                                                                                                                                                                                    const title = document.createElement("strong");
                                                                                                                                                                                                                                                                                                                                                                                                                                        title.textContent = p.name;
                                                                                                                                                                                                                                                                                                                                                                                                                                            const details = document.createElement("p");
                                                                                                                                                                                                                                                                                                                                                                                                                                                details.className = "muted";
                                                                                                                                                                                                                                                                                                                                                                                                                                                    details.textContent = `${p.category} · ${p.stock} ${p.unit} · Costo: ${money(p.cost)} · Venta: ${money(p.price)} · Bs. ${convertirABolivares(p.price)?.toLocaleString("es-VE", {minimumFractionDigits: 2, maximumFractionDigits: 2}) ?? "Tasa no disponible"}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        const actions = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                            actions.className = "actions";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                const add = document.createElement("button");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    add.textContent = "+ Entrada";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        add.onclick = () => adjust(p.id, 1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const remove = document.createElement("button");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                remove.className = "gold";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    remove.textContent = "− Salida";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        remove.onclick = () => adjust(p.id, -1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            actions.append(add, remove);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                item.append(title, details, actions);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    el("products").append(item);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function adjust(id, direction) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const p = products.find(x => x.id === id);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const value = prompt(direction === 1 ? "Cantidad que ingresó:" : "Cantidad que salió:");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (value === null) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const qty = Number(value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!Number.isFinite(qty) || qty <= 0) return notify("Introduce una cantidad válida.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (direction < 0 && qty > p.stock) return notify("No hay suficiente existencia.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    p.stock += direction * qty;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      save();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        notify("Existencia actualizada.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        el("productForm").addEventListener("submit", event => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          event.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const name = el("name").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const stock = Number(el("stock").value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const cost = Number(el("cost").value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const price = Number(el("price").value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!name || ![stock,cost,price].every(Number.isFinite) || stock < 0 || cost < 0 || price < 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return notify("Revisa los datos introducidos.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            products.push({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    name, category:el("category").value, unit:el("unit").value, stock, cost, price
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        save();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          event.target.reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            el("stock").value = "0";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              el("cost").value = "0";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                el("price").value = "0";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  notify("Producto guardado en este dispositivo.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  el("search").addEventListener("input", render);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function actualizarTasaBCV() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const clave = "jireh_tasa_bcv";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const respuesta = await fetch(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "https://bcv.today/api/v1/rate.json",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        { cache: "no-cache" }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!respuesta.ok) throw new Error("No se pudo consultar la tasa");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const datos = await respuesta.json();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const tasa = Number(datos.USD);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!Number.isFinite(tasa) || tasa <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  throw new Error("Tasa no válida");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const registro = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                tasa: tasa,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      fecha: datos.effective_date || datos.date || "",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            consultada: new Date().toISOString()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    localStorage.setItem(clave, JSON.stringify(registro));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        console.log("Tasa consultada:", registro);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return registro;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const guardada = localStorage.getItem(clave);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (guardada) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            console.warn("Sin conexión: usando la última tasa guardada.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return JSON.parse(guardada);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          console.error("No se pudo obtener la tasa BCV:", error);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
